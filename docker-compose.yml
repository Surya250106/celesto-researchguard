services:
  ledger:
    image: postgres:16-alpine
    container_name: researchguard_ledger
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researchguard
    ports:
      - "5432:5432"
    volumes:
      - ./seeds/01_runs.sql:/docker-entrypoint-initdb.d/01_runs.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchguard"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchguard_api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@ledger:5432/researchguard
      - CELESTO_PROVIDER=${CELESTO_PROVIDER:-cloud}
      - CELESTO_API_KEY=${CELESTO_API_KEY:-}
      - CELESTO_BACKEND=${CELESTO_BACKEND:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - API_PORT=${API_PORT:-8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CELESTO_NO_TELEMETRY=1
    depends_on:
      ledger:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
